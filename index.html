<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>NCERT Paper Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Noto+Serif:wght@400;700&family=Noto+Serif+Devanagari:wght@400;700&family=Noto+Sans+Devanagari:wght@400;600&display=swap">
<style>
/* Layout: fixed left rail of navigation + a single working column; the exam paper itself is the one "object" with a paper surface. */
:root{
  --bg:#f4f7f6; --surface:#ffffff; --surface-2:#eaf1ef; --line:#d5e0dd; --fg:#16231f; --muted:#5b6d68;
  --accent:#0d7a6f; --accent-ink:#ffffff; --accent-soft:#d6efea;
  --ok:#1f7a3a; --ok-soft:#dff3e5; --warn:#9a5b00; --warn-soft:#fbefd6; --bad:#b4232c; --bad-soft:#fbe3e4; --ai:#5b47b8; --ai-soft:#ece8fb;
  --paper:#ffffff; --paper-ink:#111111; --paper-line:#9a9a9a;
  --f-ui:"Figtree","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-paper:"Noto Serif","Noto Serif Devanagari",Georgia,"Times New Roman",serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1715; --surface:#16211e; --surface-2:#1d2b28; --line:#2c3d39; --fg:#e4eeeb; --muted:#9bb0aa;
  --accent:#3cc4b3; --accent-ink:#04201c; --accent-soft:#163a35;
  --ok:#6fd38b; --ok-soft:#173022; --warn:#f0b54a; --warn-soft:#3a2c12; --bad:#ff8a8f; --bad-soft:#3c1a1c; --ai:#b4a6ff; --ai-soft:#2a2547;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1715; --surface:#16211e; --surface-2:#1d2b28; --line:#2c3d39; --fg:#e4eeeb; --muted:#9bb0aa;
  --accent:#3cc4b3; --accent-ink:#04201c; --accent-soft:#163a35;
  --ok:#6fd38b; --ok-soft:#173022; --warn:#f0b54a; --warn-soft:#3a2c12; --bad:#ff8a8f; --bad-soft:#3c1a1c; --ai:#b4a6ff; --ai-soft:#2a2547;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-ui);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.9rem;line-height:1.15} h2{font-size:1.4rem} h3{font-size:1.1rem}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:1.05rem}
.brand b{font-family:var(--f-display);font-size:1.08rem;font-weight:600;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:.75rem}
.nav{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;border:0;background:none;text-align:left;cursor:pointer;color:var(--fg);width:100%}
.nav svg{width:18px;height:18px;flex:none;color:var(--muted)}
.nav:hover{background:var(--surface-2)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav[aria-current="page"] svg{color:var(--accent)}
.rail-foot{margin-top:auto;font-size:.75rem;color:var(--muted);padding:8px 10px;line-height:1.4}
main{padding-block:28px 80px;padding-inline:clamp(16px,3vw,40px);min-width:0;max-width:1180px;width:100%}
.head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.head p{margin:6px 0 0;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.85rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h3{margin-bottom:10px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:500;line-height:1.2;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none;border-color:transparent;padding:6px 8px;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn svg{width:16px;height:16px}
label.f{display:grid;gap:5px;font-size:.85rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=search],input[type=date],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%;min-width:0;font-weight:400;color:var(--fg)}
textarea{resize:vertical;min-height:60px;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;letter-spacing:.03em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.ai{background:var(--ai-soft);color:var(--ai)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.note{border-radius:8px;padding:10px 14px;font-size:.9rem;display:flex;gap:10px;align-items:flex-start}
.note.warn{background:var(--warn-soft);color:var(--warn)} .note.bad{background:var(--bad-soft);color:var(--bad)} .note.ok{background:var(--ok-soft);color:var(--ok)} .note.info{background:var(--accent-soft);color:var(--accent)} .note.ai{background:var(--ai-soft);color:var(--ai)}
.note b{font-weight:700}
/* Stepper */
.stepper{display:flex;gap:4px;overflow-x:auto;margin-bottom:22px;padding-bottom:4px}
.step{flex:1 0 auto;min-width:96px;border:0;background:none;text-align:left;padding:8px 6px 0;border-top:3px solid var(--line);cursor:pointer;color:var(--muted);font-size:.8rem}
.step b{display:block;font-size:.88rem;color:var(--fg);font-weight:600}
.step.done{border-top-color:var(--accent)} .step.cur{border-top-color:var(--accent)} .step.cur b{color:var(--accent)}
.step[disabled]{cursor:default}
.wiz-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
/* Choice cards */
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.card{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;cursor:pointer;text-align:left;display:grid;gap:4px;min-width:0}
.card:hover{border-color:var(--accent)}
.card[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.card .big{font-family:var(--f-display);font-size:2rem;font-weight:600;line-height:1}
.card small{color:var(--muted)}
/* Chapter list */
.chap{display:grid;grid-template-columns:auto 2.4rem minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line)}
.chap:last-child{border-bottom:0}
.chap .no{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem}
.chap.off{opacity:.55}
.chaps{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.tb-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.weight{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.weight button{border:0;background:none;padding:2px 8px;font-size:.75rem;cursor:pointer;color:var(--muted)}
.weight button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
/* Distribution table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.dist{border-collapse:collapse;width:100%;min-width:760px;font-variant-numeric:tabular-nums}
table.dist th,table.dist td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.dist th{font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--surface-2)}
table.dist input[type=number]{width:70px}
table.dist tfoot td{font-weight:700;border-bottom:0}
.tally{display:flex;align-items:baseline;gap:8px;font-family:var(--f-display);font-variant-numeric:tabular-nums}
.tally .n{font-size:2.2rem;font-weight:600;line-height:1}
.tally.ok .n{color:var(--ok)} .tally.bad .n{color:var(--bad)}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px 16px}
.types label{display:flex;gap:8px;align-items:center;font-size:.92rem;padding:4px 0;cursor:pointer}
/* Mix sliders */
.mix{display:grid;grid-template-columns:90px minmax(0,1fr) 44px;gap:8px 12px;align-items:center}
.mix output{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
input[type=range]{accent-color:var(--accent);width:100%}
/* Editor */
.ed-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px;align-items:start}
.ed-side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:grid;gap:14px}
.sec{margin-bottom:22px}
.sec-h{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin-bottom:10px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;display:grid;gap:8px}
.q.ai-unrev{border-left:3px solid var(--ai)}
.q.missing{border-style:dashed;border-color:var(--bad)}
.q-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.q-num{font-family:var(--f-display);font-weight:600;font-size:1.05rem;min-width:2ch}
.q-tools{margin-left:auto;display:flex;gap:2px;flex-wrap:wrap}
.q textarea.qt{min-height:52px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px}
.opt{display:flex;gap:6px;align-items:center}
.opt input[type=radio]{accent-color:var(--accent)}
.q-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.85rem}
.q-meta select,.q-meta input{width:auto;padding:4px 8px;font-size:.85rem}
.q-meta input[type=number]{width:64px}
.keybox{background:var(--surface-2);border-radius:8px;padding:10px;display:grid;gap:6px}
.keybox label{font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
.orbox{border-top:1px dashed var(--line);padding-top:8px;display:grid;gap:6px}
.qimg{max-width:240px;border:1px solid var(--line);border-radius:6px;background:#fff}
.cov{display:grid;gap:6px;font-size:.85rem}
.cov-row{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:8px;align-items:center}
.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;grid-column:1/-1}
.bar i{display:block;height:100%;background:var(--accent)}
.progress{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
/* Paper preview */
.paper-frame{background:var(--surface-2);border-radius:var(--r);padding:18px;overflow-x:auto}
.paper-sheet{background:var(--paper);color:var(--paper-ink);width:min(100%,794px);margin:0 auto;padding:40px 44px;box-shadow:0 2px 14px rgba(0,0,0,.12)}
/* The exam paper (also used for PDF) */
.pp{font-family:var(--f-paper);color:var(--paper-ink);font-size:12.5pt;line-height:1.45;background:var(--paper)}
.pp *{color:var(--paper-ink)}
.pp-head{display:flex;gap:14px;align-items:center;justify-content:center;text-align:center;border-bottom:1.5px solid var(--paper-ink);padding-bottom:8px}
.pp-head img{width:64px;height:64px;object-fit:contain}
.pp-school{font-size:17pt;font-weight:700;letter-spacing:.02em;line-height:1.2}
.pp-sub{font-size:11pt}
.pp-exam{font-size:13pt;font-weight:700;margin-top:2px}
.pp-meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 18px;padding:6px 0;font-size:11.5pt}
.pp-student{display:flex;gap:18px;flex-wrap:wrap;padding:4px 0 8px;font-size:11.5pt;border-bottom:1px solid var(--paper-ink)}
.pp-student span{flex:1 1 200px;white-space:nowrap}
.pp-mt{display:flex;justify-content:space-between;font-weight:700;padding:6px 0;border-bottom:1px solid var(--paper-ink)}
.pp-gi{font-size:11pt;padding:6px 0 4px}
.pp-gi ol{margin:2px 0 0;padding-left:22px}
.pp-sec{margin-top:12px}
.pp-sec h4{text-align:center;font-size:12.5pt;margin:6px 0 2px;letter-spacing:.06em}
.pp-si{text-align:center;font-style:italic;font-size:11pt;margin:0 0 8px}
.pq{display:grid;grid-template-columns:30px minmax(0,1fr) 34px;gap:4px;margin:0 0 10px;page-break-inside:avoid;break-inside:avoid}
.pq-n{font-weight:700}
.pq-m{text-align:right;font-weight:700;font-size:11pt}
.pq-b p{margin:0}
.pq-opts{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px;margin-top:4px;break-inside:avoid}
.pq-opts.one{grid-template-columns:1fr}
.pq-or{text-align:center;font-weight:700;margin:6px 0}
.pq-img{max-width:60%;max-height:240px;margin:6px 0;display:block}
.pq-lines{margin-top:6px}
.pq-lines div{border-bottom:1px solid var(--paper-line);height:26px}
.pq table{border-collapse:collapse;margin-top:6px;width:100%;break-inside:avoid}
.pq td,.pq th{border:1px solid var(--paper-ink);padding:3px 8px;font-size:11.5pt;text-align:left;vertical-align:top}
.pp-end{text-align:center;margin-top:14px;font-size:11pt;letter-spacing:.2em}
.pp-key h4{text-align:center;margin:0 0 10px;font-size:14pt}
.pk{display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px;margin-bottom:8px;break-inside:avoid;page-break-inside:avoid}
.pk .lab{font-weight:700;font-size:10.5pt;text-transform:uppercase;letter-spacing:.04em}
.pk p{margin:2px 0}
.pp-pagebreak{page-break-before:always;break-before:page}
.pdf-host{position:fixed;left:-12000px;top:0;width:186mm;background:#fff}
.pdf-host .pp{font-size:11.5pt}
/* Lists */
.list{display:grid;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center}
.item h3{font-family:var(--f-ui);font-size:1rem;font-weight:600}
.item .meta{color:var(--muted);font-size:.85rem;display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center}
.item .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.stat{display:grid;gap:2px}
.stat .v{font-family:var(--f-display);font-size:2rem;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);font-size:.85rem}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:1rem;margin-bottom:4px}
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:24px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 28px;margin-bottom:18px}
.hero p{color:var(--muted);margin:8px 0 16px;max-width:52ch}
.mini-sheet{background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:16px 18px;font-family:var(--f-paper);font-size:.72rem;line-height:1.5;box-shadow:0 6px 18px rgba(0,0,0,.12);transform:rotate(1.2deg)}
.mini-sheet *{color:var(--paper-ink)}
.mini-sheet .t{text-align:center;font-weight:700;font-size:.82rem;border-bottom:1px solid var(--paper-ink);padding-bottom:4px;margin-bottom:6px}
.mini-sheet .r{display:flex;justify-content:space-between;gap:8px}
/* Toasts + modal */
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:50;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:.9rem;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.toast.bad{background:var(--bad);color:#fff}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,18,.45);display:grid;place-items:center;z-index:40;padding:16px}
.modal{background:var(--surface);border-radius:12px;padding:20px;max-width:440px;width:100%;display:grid;gap:14px;border:1px solid var(--line)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font-weight:500;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.radio-cards{display:grid;gap:8px}
.radio-cards label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;background:var(--surface)}
.radio-cards label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radio-cards input{margin-top:3px;accent-color:var(--accent)}
.radio-cards small{display:block;color:var(--muted)}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:3s}.progress i{transition:none}}
.mobile-bar{display:none}
@media (max-width:900px){
  .ed-layout{grid-template-columns:minmax(0,1fr)}
  .ed-side{position:static}
  .hero{grid-template-columns:minmax(0,1fr)}
  .mini-sheet{display:none}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .mobile-bar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 16px;gap:10px;align-items:center;justify-content:space-between}
  .mobile-bar select{width:auto;max-width:60%}
  main{padding-block:18px 80px}
  .item{grid-template-columns:minmax(0,1fr)}
  .item .acts{justify-content:flex-start}
  .paper-sheet{padding:22px 16px}
  .chap{grid-template-columns:auto 2rem minmax(0,1fr)}
  .chap .weight{grid-column:3}
}
</style>

<div class="app">
  <aside class="rail" id="rail"></aside>
  <div style="min-width:0">
    <div class="mobile-bar"><div class="brand" style="padding:0"><div class="brand-mark">P</div><b>Paper Maker</b></div><select id="mnav" aria-label="Go to"></select></div>
    <main id="main"></main>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modal"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
"use strict";
/* ============================================================
   NCERT Paper Maker — single-page app
   Storage: per-teacher private store (claude db) → browser storage fallback
   AI: Claude via the page's sample capability (no API key in page)
   PDF: html2pdf (html2canvas + jsPDF), saved via the downloads capability
   ============================================================ */

const Store = {
  mode:"memory", db:null, base:null,
  async init(){
    try{
      if (window.claude && claude.use){
        const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
        if (db && user){ const id = await user.id(); if (id){ this.db = db; this.base = `data/users/${id}`; this.mode = "db"; return; } }
      }
    }catch(e){ /* fall through */ }
    try{ localStorage.setItem("npm:probe","1"); localStorage.removeItem("npm:probe"); this.mode = "local"; }catch(e){ this.mode = "memory"; }
  },
  async loadAll(){
    const out = {paper:[], tpl:[], bank:[], settings:[], syl:[]};
    if (this.mode === "db"){
      const snap = await this.db.collection(this.base).get();
      snap.docs.forEach(d => { const v = d.data(); if (v && out[v.kind]) { try{ out[v.kind].push(JSON.parse(v.json)); }catch(e){} } });
    } else if (this.mode === "local"){
      try{ for (let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if (!k.startsWith("npm:")) continue; const kind = k.split(":")[1]; if (out[kind]) { try{ out[kind].push(JSON.parse(localStorage.getItem(k))); }catch(e){} } } }catch(e){}
    }
    return out;
  },
  async put(kind, obj){
    if (this.mode === "db") return this.db.collection(this.base).doc(`${kind}_${obj.id}`).set({kind, id:obj.id, updated:Date.now(), json:JSON.stringify(obj)});
    if (this.mode === "local"){ try{ localStorage.setItem(`npm:${kind}:${obj.id}`, JSON.stringify(obj)); }catch(e){ throw {message:"This browser refused to save (storage may be full or blocked)."}; } }
  },
  async del(kind, id){
    if (this.mode === "db") return this.db.collection(this.base).doc(`${kind}_${id}`).delete();
    if (this.mode === "local"){ try{ localStorage.removeItem(`npm:${kind}:${id}`); }catch(e){} }
  }
};
async function save(kind, obj){ try{ await Store.put(kind, obj); return true; }catch(e){ toast("Couldn't save: " + (e.message || "storage is unavailable") + " Your work is still open here.", true); return false; } }

function allChapters(c, sid){ const s = subject(c,sid); if (!s) return []; return s.textbooks.flatMap(t => t.chapters.map(ch => ({...ch, tb:t}))); }
function chapterById(c, sid, id){ return allChapters(c,sid).find(x => x.id === id); }
function chapterLabel(c, sid, id){ const ch = chapterById(c,sid,id); return ch ? `Ch ${ch.no}. ${ch.title}` : "Unknown chapter"; }

function autoSections(M, cat, allowed){
  const pick = (...c) => c.find(x => allowed.includes(x)) || allowed[0];
  const objT = pick("mcq","fib","oneword","tf") , vsaT = pick("vsa"), saT = pick("sa","numerical"), laT = pick("la","case","writing");
  let obj = Math.round(M*0.2), vsa = Math.floor(M*0.2/2), sa = Math.floor(M*0.3/3);
  let rem = M - obj - vsa*2 - sa*3; let la = Math.floor(rem/5); obj += rem - la*5;
  const rows = [];
  if (obj && objT) rows.push({type:objT, count:obj, marks:1});
  if (vsa && vsaT) rows.push({type:vsaT, count:vsa, marks:2});
  if (sa && saT) rows.push({type:saT, count:sa, marks:3});
  if (la && laT) rows.push({type:laT, count:la, marks:5, choices: la>1?Math.min(2,la):0});

function diffList(n, diff, mix){
  if (diff !== "mixed") return Array(n).fill(diff);
  const shares = [["easy",mix.e],["moderate",mix.m],["difficult",mix.d]].map(([k,p])=>({k, exact:n*p/100}));
  shares.forEach(s=>{s.n=Math.floor(s.exact); s.r=s.exact-s.n;});
  let left = n - shares.reduce((a,s)=>a+s.n,0);
  [...shares].sort((a,b)=>b.r-a.r).forEach(s=>{ if (left>0){ s.n++; left--; } });
  return shares.flatMap(s=>Array(s.n).fill(s.k));
}
function chapterSlots(n, chapterIds, weights, offset){
  const ws = chapterIds.map(id=>({id, w:weights[id]||2}));
  const total = ws.reduce((a,x)=>a+x.w,0);
  const alloc = ws.map(x=>({id:x.id, exact:n*x.w/total})); alloc.forEach(a=>{a.n=Math.floor(a.exact); a.r=a.exact-a.n;});
  let left = n - alloc.reduce((a,x)=>a+x.n,0);
  const order = alloc.map((a,i)=>({a, key:a.r + ((i - offset + alloc.length) % alloc.length === 0 ? 0.001 : 0)})).sort((x,y)=>y.key-x.key || 0);
  // rotate tie-breaks so different sections favour different chapters
  const rot = [...alloc.slice(offset % alloc.length), ...alloc.slice(0, offset % alloc.length)].sort((x,y)=>y.r-x.r);
  rot.forEach(a=>{ if (left>0){ a.n++; left--; } });
  const out = []; let more = true;
  while (more){ more = false; alloc.forEach(a=>{ if (a.n>0){ out.push(a.id); a.n--; more = true; } }); }
  return out;
}
const norm = s => String(s||"").toLowerCase().replace(/[^a-z0-9ऀ-ॿ ]+/g," ").split(/\s+/).filter(w=>w.length>2);
function similar(a, b){ const A = new Set(norm(a)), B = new Set(norm(b)); if (!A.size || !B.size) return 0; let i=0; A.forEach(x=>{ if (B.has(x)) i++; }); return i / Math.min(A.size, B.size); }
function isDup(text, others){ return others.some(o => similar(text, o) >= 0.85); }

const TYPE_GUIDE = {

function sectionPrompt(cfg, type, marks, slots, avoid){

function validateAI(raw, slot, type, marks, allowedChapters){
  if (!raw || typeof raw !== "object") return null;
  const text = typeof raw.text === "string" ? raw.text.trim() : "";
  if (text.length < 4) return null;
  const chapterId = allowedChapters.includes(raw.chapterId) ? raw.chapterId : null;
  if (raw.chapterId && !chapterId) return null; // wandered outside selected chapters
  const q = {type, marks, text, chapterId: chapterId || slot.chapterId, difficulty: ["easy","moderate","difficult"].includes(raw.difficulty) ? raw.difficulty : slot.difficulty, answer:String(raw.answer||"").trim(), solution:String(raw.solution||"").trim(), scheme:String(raw.markingScheme||raw.scheme||"").trim(), source:"ai", reviewed:false};
  if (TYPES[type].opts){
    if (!Array.isArray(raw.options) || raw.options.length !== 4 || raw.options.some(o=>typeof o!=="string"||!o.trim())) return null;
    const ai = Number(raw.answerIndex); if (!Number.isInteger(ai) || ai<0 || ai>3) return null;
    q.options = raw.options.map(o=>o.trim()); q.answerIndex = ai; if (!q.answer) q.answer = `(${"abcd"[ai]}) ${q.options[ai]}`; else q.answer = `(${"abcd"[ai]}) ${q.options[ai]}`;
  }

    if (!Array.isArray(raw.pairs) || raw.pairs.length < 3 || raw.pairs.some(p=>!Array.isArray(p)||p.length!==2||!p[0]||!p[1])) return null;
    q.pairs = raw.pairs.map(p=>[String(p[0]).trim(), String(p[1]).trim()]);
    q.matchOrder = shuffledOrder(q.pairs.length);
    q.answer = q.pairs.map((p,i)=>`(${ROMAN[i]}) → (${"pqrstu"[q.matchOrder.indexOf(i)]}) ${p[1]}`).join("; ");
  }

  return q;
}
function shuffledOrder(n){ const a = [...Array(n).keys()]; for (let i=n-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } if (n>1 && a.every((v,i)=>v===i)) [a[0],a[1]]=[a[1],a[0]]; return a; }

function aiErrMsg(e){

  if (c==="unavailable"||c==="sampling_disabled"||c==="not_declared") return "AI generation isn't available in this view. Open the page on claude.ai while signed in.";

async function fillPending(paper){

    for (let i=0;i<idx.length;i+=8) jobs.push({si, ids: idx.slice(i,i+8).map(k=>sec.questions[k].id)});
  });

  if (!jobs.length){ S.gen.running = false; render(); return; }
  if (!S.ai){ S.gen = {running:false, done:0, total:0, errors:["AI generation isn't available in this view, so the remaining questions are empty. Write them yourself, or open the page on claude.ai while signed in and use Retry."], skipped:[]}; await persistPaper(); render(); return; }
  for (const job of jobs){
    const sec = paper.sections[job.si];
    const slots = job.ids.map(id=>sec.questions.find(q=>q.id===id)).filter(q=>q && q.pending);
    if (!slots.length){ S.gen.done++; continue; }
    S.gen.msg = `Writing Section ${sec.label}: ${TYPES[sec.type].short} (${slots.length} question${slots.length>1?"s":""})`; renderGenStatus();

      const list = Array.isArray(res) ? res : (res && Array.isArray(res.questions) ? res.questions : []);
      if (res && Array.isArray(res.skipped)) res.skipped.forEach(sk => S.gen.skipped.push(`${chapterLabel(cfg.classNo,cfg.subjectId,sk.chapterId)}: ${sk.reason||"no reason given"}`));

          if (isDup(v.text, paper.sections.flatMap(s=>s.questions.filter(q=>!q.pending).map(q=>q.text)))){ bad++; continue; }

    const orQ = slot.wantOr && list[0]?.or ? validateAI(list[0].or, slot, sec.type, old.marks, p.config.chapterIds) : null;
    const kk = sec.questions.indexOf(old); if (kk < 0) throw {message:"That question was removed while the new one was being written."};
    sec.questions[kk] = mkQ({...v, lines: old.lines ?? linesFor(sec.type, old.marks), or: orQ ? mkQ(orQ) : null});
    toast("Question replaced. Review it before use.");
    softSave();
  }catch(e){ old.busy = false; toast(e.code ? aiErrMsg(e) : (e.message||"Couldn't regenerate."), true); }
  refreshEditorBody();
}
function replaceFromBank(si, k){
  const p = S.paper, sec = p.sections[si], old = sec.questions[k];
  const usedIds = new Set(p.sections.flatMap(s=>s.questions.map(q=>q.bankId)).filter(Boolean));
  const usedTexts = p.sections.flatMap(s=>s.questions.map(q=>q.text));
  const pool = [...S.bank, ...STARTER_BANK].filter(b => b.classNo===p.config.classNo && b.subjectId===p.config.subjectId && b.chapterId===old.chapterId && b.type===sec.type && !usedIds.has(b.id) && !usedTexts.includes(b.text));
  if (!pool.length){ toast("No other question from this chapter and type is in your bank."); return; }
  const b = pool.sort((x,y)=>(y.reviewed?1:0)-(x.reviewed?1:0))[0];
  sec.questions[k] = mkQ({...clone(b), marks: old.marks, lines: old.lines, source: b.starter ? "starter" : "bank", reviewed: !!b.reviewed, bankId:b.id});
  toast(b.reviewed ? "Replaced with a verified bank question." : "Replaced with a starter question. Check it before use.");
  softSave(); refreshEditorBody();
}

function paperTotal(p){ return p.sections.reduce((a,s)=>{ const qs = s.questions; const marks = qs.map(q=>+q.marks||0).sort((x,y)=>y-x); const n = (s.attempt && s.attempt < qs.length) ? s.attempt : qs.length; return a + marks.slice(0,n).reduce((x,y)=>x+y,0); },0); }
function coverage(p){
  const m = {}; p.sections.forEach(s=>s.questions.forEach(q=>{ if (!q.pending) m[q.chapterId] = (m[q.chapterId]||0) + (+q.marks||0); }));
  return p.config.chapterIds.map(id=>({id, marks:m[id]||0}));
}

function chapterOptions(p, cur){ return p.config.chapterIds.map(id=>`<option value="${id}" ${id===cur?"selected":""}>${esc(chapterLabel(p.config.classNo,p.config.subjectId,id))}</option>`).join(""); }

function paperHTML(p, mode){

async function buildPdf(p, mode){
  if (typeof html2pdf === "undefined") throw {message:"The PDF library didn't load. Check your connection and reload the page."};
  const host = document.createElement("div"); host.className = "pdf-host"; host.innerHTML = paperHTML(p, mode); document.body.appendChild(host);
  try{
    try{ await document.fonts.ready; }catch(e){}
    if (p.config.language === "hi" || /[ऀ-ॿ]/.test(host.textContent)){ try{ await document.fonts.load('16px "Noto Serif Devanagari"'); }catch(e){ toast("Hindi font didn't load; Hindi text may use a fallback font.", true); } }
    const opt = {margin:[12,12,16,12], image:{type:"jpeg", quality:0.96}, html2canvas:{scale:2, useCORS:true, backgroundColor:"#ffffff", logging:false}, jsPDF:{unit:"mm", format:"a4", orientation:"portrait"}, pagebreak:{mode:["css","legacy"], avoid:[".pq",".pk",".pq-opts","table",".pp-gi",".pp-head"]}};
    const pdf = await html2pdf().set(opt).from(host.firstElementChild).toPdf().get("pdf");
    const total = pdf.internal.getNumberOfPages(); const W = pdf.internal.pageSize.getWidth(), H = pdf.internal.pageSize.getHeight();
    const foot = (S.settings.footer || S.settings.school || "");
    const ascii = foot && !/[^\x00-\x7F]/.test(foot);
    for (let i=1;i<=total;i++){ pdf.setPage(i); pdf.setFontSize(9); pdf.setTextColor(70); pdf.text(`Page ${i} of ${total}`, W-12, H-8, {align:"right"}); if (ascii) pdf.text(foot.slice(0,80), 12, H-8); pdf.setDrawColor(150); pdf.line(12, H-12, W-12, H-12); }
    return pdf.output("blob");
  } finally { host.remove(); }
}
const fileBase = p => p.name.replace(/[^\wऀ-ॿ\- ]+/g,"").replace(/\s+/g,"_").slice(0,60) || "question_paper";
async function saveFile(filename, blob){
  if (!S.dl){ const url = URL.createObjectURL(blob); const link = document.createElement("a"); link.href = url; link.download = filename; document.body.appendChild(link); link.click(); link.remove(); setTimeout(()=>URL.revokeObjectURL(url), 4000); return {status:"saved"}; }
  try{ const r = await S.dl.save({filename, data:blob}); return r; }
  catch(e){ if (e && e.code==="declined") throw {message:"Download cancelled."}; throw {message: e?.code==="too_large" ? "The file is too large to download. Remove or shrink some figures." : `Download failed${e?.message?": "+e.message:""}.`}; }
}
async function downloadPdf(){
  const p = S.paper, btn = $("#dl-pdf-btn");
  if (btn){ btn.disabled = true; btn.innerHTML = `<span class="spin"></span>Building PDF…`; }
  try{
    if (S.dlMode === "separate"){
      const a = await buildPdf(p, "paper"); await saveFile(fileBase(p)+"_question_paper.pdf", a);
      const b = await buildPdf(p, "solutions-only"); await saveFile(fileBase(p)+"_answer_key.pdf", b);
      toast("Both PDFs saved.");
    } else {
      const blob = await buildPdf(p, S.dlMode); await saveFile(fileBase(p) + (S.dlMode==="paper"?"":S.dlMode==="paper+key"?"_with_key":"_with_solutions") + ".pdf", blob);
      toast("PDF saved.");
    }
    if (!p.example){ p.lastDownloaded = Date.now(); softSave(); }
  }catch(e){ toast(e.message || "Couldn't build the PDF. Try again.", true); }
  finally{ const b2 = $("#dl-pdf-btn"); if (b2){ b2.disabled = false; b2.innerHTML = `${IC.dl}Download PDF`; } }
}
async function downloadDoc(){
  const p = S.paper; const mode = S.dlMode==="separate" ? "paper+sol" : S.dlMode;
  const css = `body{font-family:'Noto Serif','Mangal',Georgia,serif;font-size:12pt;color:#000}.pp-head{text-align:center;border-bottom:1.5pt solid #000;padding-bottom:6pt}.pp-head img{width:60px;height:60px}.pp-school{font-size:16pt;font-weight:bold}.pp-exam{font-weight:bold}.pp-meta span,.pp-student span,.pp-mt span{margin-right:24pt}.pp-mt{font-weight:bold;border-bottom:1pt solid #000;padding:4pt 0}.pp-sec h4{text-align:center;letter-spacing:2pt}.pp-si{text-align:center;font-style:italic}.pq{margin:0 0 10pt}.pq-n{font-weight:bold;display:inline}.pq-m{font-weight:bold;text-align:right}.pq-opts span{margin-right:24pt}.pq-or{text-align:center;font-weight:bold}.pq-lines div{border-bottom:1pt solid #999;height:22pt}table{border-collapse:collapse}td,th{border:1pt solid #000;padding:3pt 6pt}.pp-end{text-align:center}.pp-pagebreak{page-break-before:always}.pk{margin-bottom:6pt}.lab{font-weight:bold}`;
  // Word handles block layout better than grid: rewrite question rows as simple tables
  const body = paperHTML(p, mode).replace(/<div class="pq"><div class="pq-n">(.*?)<\/div><div class="pq-b">/g, '<table class="pq" style="width:100%;border:0"><tr><td style="border:0;width:28pt;vertical-align:top"><b>$1</b></td><td style="border:0;vertical-align:top">').replace(/<\/div><div class="pq-m">(\[\d+\])<\/div><\/div>/g, '</td><td style="border:0;width:30pt;vertical-align:top;text-align:right"><b>$1</b></td></tr></table>');
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>${esc(p.name)}</title><style>@page{size:21cm 29.7cm;margin:1.5cm}${css}</style></head><body>${body}</body></html>`;
  try{ await saveFile(fileBase(p)+".doc", new Blob(["﻿", html], {type:"application/msword"})); toast("Word file saved."); }

}

/* ---------------- Image helper ---------------- */
function readImage(file, maxW, cb){
  if (!file || !file.type.startsWith("image/")){ toast("Choose an image file (PNG or JPG).", true); return; }
  const fr = new FileReader();
  fr.onload = () => { const img = new Image(); img.onload = () => { const s = Math.min(1, maxW / img.width); const c = document.createElement("canvas"); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s); const x = c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height); cb(c.toDataURL("image/jpeg", 0.85)); }; img.onerror = () => toast("That image couldn't be read.", true); img.src = fr.result; };
  fr.readAsDataURL(file);
}

function addChapters(t, titles){
  const prefix = t.id; let maxNo = t.chapters.reduce((m,c)=>Math.max(m,c.no),0);
  titles.forEach(title => { maxNo++; t.chapters.push({id:`${prefix}-x${uid()}`, no:maxNo, title, inSyllabus:true}); });
  if (t.status==="empty"){ t.status = "unverified"; t.source = "Entered by teacher. Mark verified after checking against the NCERT textbook."; }
  saveSyl(); render();
}

function onQField(el, isChange){
  const q = qAt(el.dataset.q); const f = el.dataset.f; if (!q) return;
  if (f==="text"||f==="answer"||f==="solution"||f==="scheme"){ q[f] = el.value; if (q.source==="ai" && f==="text"){} }
  else if (f.startsWith("opt")){ q.options[+f.slice(3)] = el.value; if (q.answerIndex===+f.slice(3)) q.answer = `(${"abcd"[q.answerIndex]}) ${el.value}`; }
  else if (f==="answerIndex"){ q.answerIndex = +el.value; q.answer = `(${"abcd"[q.answerIndex]}) ${q.options[q.answerIndex]||""}`; if (S.showKey && isChange) refreshEditorBody(); }
  else if (f.startsWith("pairL")||f.startsWith("pairR")){ const i = +f.slice(5); while (q.pairs.length <= i) q.pairs.push(["",""]); q.pairs[i][f[4]==="L"?0:1] = el.value; const valid = q.pairs.filter(pp=>pp[0]||pp[1]); if (!q.matchOrder || q.matchOrder.length !== q.pairs.length) q.matchOrder = shuffledOrder(q.pairs.length); q.answer = q.pairs.map((pp,j)=>`(${ROMAN[j]}) → (${"pqrstu"[q.matchOrder.indexOf(j)]}) ${pp[1]}`).join("; "); }
  else if (f==="marks"){ if (!isChange) return; q.marks = Math.max(0, Math.round(+el.value||0)); const outer = qAt(el.dataset.q.split(".").slice(0,2).join(".")); if (outer.or) outer.or.marks = q.marks; refreshSideOnly(); }
  else if (f==="lines"){ q.lines = Math.max(0, Math.min(30, Math.round(+el.value||0))); }
  else if (f==="reviewed"){ q.reviewed = el.checked; refreshEditorBody(); }
  else if (f==="chapterId"||f==="difficulty"){ q[f] = el.value; refreshSideOnly(); }
  softSave();
}

  e.preventDefault();
  if (e.target.id === "add-ch"){ const v = $("#new-ch").value.trim(); if (!v) return; addChapters(subject(S.sylSel.cls,S.sylSel.sub).textbooks.find(x=>x.id===S.sylSel.tb), [v]); setTimeout(()=>$("#new-ch")?.focus(),0); }
  if (e.target.id === "add-sub"){ const v = $("#new-sub").value.trim(); if (!v) return; const c = S.sylSel.cls; const s = {id:`c${c}-u${uid()}`, name:v, cat:$("#new-sub-cat").value, textbooks:[]}; S.syl.classes[c].subjects.push(s); S.sylSel.sub = s.id; saveSyl(); render(); toast(`${v} added to Class ${c}. Add its textbook next.`); }
});
$("#mnav").addEventListener("change", e => { const v = e.target.value; if (v==="create" && !S.wiz && !S.paper) newWizard(); go(v); });
document.addEventListener("keydown", e => { if (e.key==="Escape" && $("#modal").innerHTML) $("#modal").innerHTML = ""; });

/* ---------------- Boot ---------------- */
(async function boot(){
  render();
  const useCap = n => (window.claude && claude.use) ? claude.use(n).catch(()=>null) : Promise.resolve(null);
  const capsP = Promise.all([useCap("sample"), useCap("downloads")]);
  await Store.init();
  try{
    const d = await Store.loadAll();
    S.papers = d.paper; S.tpls = d.tpl; S.bank = d.bank;
    if (d.settings[0]) S.settings = {...DEFAULT_SETTINGS, ...d.settings[0]};
    if (d.syl[0] && d.syl[0].classes){ const {id, ...rest} = d.syl[0]; S.syl = rest; }
  }catch(e){ toast("Couldn't load your saved work. You can keep working; try reloading later.", true); }
  applyTheme();
  [S.ai, S.dl] = await capsP;
  render();
})();
</script>
